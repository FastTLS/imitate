name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: true
      - name: Verify module and catalog
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq '^[[:space:]]*replace[[:space:]]' go.mod
          ! go mod graph | grep -F 'github.com/FastTLS/fhttp'
          go mod verify
          go test ./...
          go vet ./...
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Check read-only updater selection and failure boundaries
        run: |
          python -m unittest discover -s tools/firefox -p 'test_*.py' -v
          python -m unittest discover -s tools/chromium -p 'test_*.py' -v

