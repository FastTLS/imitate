name: Maintain verified browser profiles

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: Product to check (all checks every supported product)
        type: choice
        options: [all, edge, chrome, firefox]
        default: all
      browser_version:
        description: Optional exact version; requires a single product
        type: string
        default: ''
      force_capture:
        description: Recollect an already adopted build
        type: boolean
        default: false
      adopt:
        description: Adopt candidates after independent evidence and combined tests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: browser-maintenance
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      browsers: ${{ steps.select.outputs.browsers }}
    steps:
      - id: select
        env:
          BROWSER: ${{ inputs.browser || 'all' }}
          VERSION: ${{ inputs.browser_version }}
        run: |
          python - <<'PY'
          import json, os
          browser = os.environ['BROWSER']
          if browser not in ('all', 'edge', 'chrome', 'firefox'):
              raise SystemExit('Unsupported browser')
          if browser == 'all' and os.environ['VERSION']:
              raise SystemExit('An exact version requires a single browser')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('browsers=' + json.dumps(['edge', 'chrome', 'firefox'] if browser == 'all' else [browser]), file=output)
          PY
  capture:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.select.outputs.browsers) }}
    uses: ./.github/workflows/browser-update.yml
    with:
      browser: ${{ matrix.browser }}
      browser_version: ${{ inputs.browser_version || '' }}
      force_capture: ${{ inputs.force_capture || false }}
  adopt:
    needs: [select, capture]
    if: ${{ always() && needs.select.result == 'success' && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: browser-profile-candidate-*
          path: incoming
      - name: Validate evidence and stage only verified profiles
        id: stage
        env:
          EXPECTED_BROWSERS: ${{ needs.select.outputs.browsers }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python tools/maintenance/maintain.py --repo . --inputs incoming --source-sha "$SOURCE_SHA" --run-url "$RUN_URL" --browsers "$EXPECTED_BROWSERS"
      - name: Validate combined catalog and export offline snapshot
        run: |
          go mod verify
          go test ./...
          go test -race ./...
          go vet ./...
          python -m unittest discover -s tools/maintenance -p 'test_*.py' -v
          mkdir -p verified-export
          go run ./cmd/imitate-export -output verified-export/fingerprints.json
          python tools/maintenance/export_manifest.py --bundle verified-export/fingerprints.json --output verified-export/manifest.json --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Publish the validated data update
        if: ${{ steps.stage.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.adopt) }}
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python tools/maintenance/publish.py --repo . --repository "$REPOSITORY" --source-sha "$SOURCE_SHA" --base "$DEFAULT_BRANCH"
      - name: Bind export to adoption result
        run: python tools/maintenance/export_manifest.py --bundle verified-export/fingerprints.json --output verified-export/manifest.json --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: browser-maintenance-result
          retention-days: 90
          if-no-files-found: error
          path: |
            verified-export/
            maintenance-result.json
      - name: Fail visibly for blocked or missing products
        if: ${{ steps.stage.outputs.blocked == 'true' }}
        run: exit 1
